name: Benchmark contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: packages/benchmark/src
        run: python -m unittest discover -s packages/benchmark/tests -v

      - name: Run deterministic contract suite
        env:
          PYTHONPATH: packages/benchmark/src
        run: >-
          python -m chronicle_bench run
          --suite packages/benchmark/fixtures/v0.1/contract.json
          --output tmp/benchmark-result.json
          --quiet
