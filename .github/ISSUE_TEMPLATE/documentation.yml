name: Documentation problem
description: Report something missing, inaccurate, unclear, or inconsistent.
title: "docs: "
body:
  - type: input
    id: location
    attributes:
      label: Document or URL
      placeholder: docs/spec/TECHNICAL_SPECIFICATION.md, section 12
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Incorrect
        - Inconsistent with another document
        - Missing
        - Unclear
        - Broken link or example
        - Accessibility
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Optional. Concrete wording is welcome but not required.
