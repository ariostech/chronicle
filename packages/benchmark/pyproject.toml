[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-bench"
version = "0.1.0"
description = "Provider-neutral benchmark harness for Chronicle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chronicle contributors" }]
dependencies = []

[project.scripts]
chronicle-bench = "chronicle_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
